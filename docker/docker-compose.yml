version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autozure-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autozure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autozure_secret}
      POSTGRES_DB: ${POSTGRES_DB:-autozure}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autozure']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autozure-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: autozure-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-autozure}:${POSTGRES_PASSWORD:-autozure_secret}@postgres:5432/${POSTGRES_DB:-autozure}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-autozure_jwt_super_secret_32chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-autozure_jwt_refresh_super_secret_32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ORIGIN: http://localhost:3000
      WORKER_CONCURRENCY: 5
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: autozure-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
